on:
  push:
  pull_request:
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.11']
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      
      - name: Install and Precompile
        run: |
          julia --project=@. -e '
            using Pkg;
            # Remove manifest to force a fresh resolution for Julia 1.11
            if isfile("Manifest.toml") rm("Manifest.toml") end;
            Pkg.instantiate();
            Pkg.precompile()'

      - name: Run Tests
        run: |
          julia --project=@. -e 'using Pkg; Pkg.test()'
          
  docs:
    name: Documentation
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        # Note: We DO use Pkg.develop() here because the project is docs/
        run: |
          julia --project=docs/ -e '
            using Pkg;
            Pkg.develop(PackageSpec(path=pwd()));
            Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs/ docs/make.jl
